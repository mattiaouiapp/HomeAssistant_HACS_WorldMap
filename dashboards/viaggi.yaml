# Travels, airports and hotels dashboard for MMOUi World Map: one tab per map.
#
# Uses the World Map card plus built-in cards. To install: Settings -> Dashboards ->
# Add dashboard -> New dashboard from scratch, open it, then menu (top right) ->
# Edit dashboard -> menu -> Raw configuration editor, and replace everything with this file.
#
# Entity IDs are fixed, so this works whatever language Home Assistant is set to.
# Viaggi uses the default map (sensor.worldmap_places / _countries). Aeroporti and
# Hotel use the maps "aeroporti" and "hotel"; their sensors
# (sensor.worldmap_aeroporti_*, sensor.worldmap_hotel_*) appear with the first flag.
#
# Generated by dev/gen_dashboard.py: change that and run
# python3 dev/gen_dashboard.py dashboards/viaggi.yaml

title: Viaggi
views:
  # ================================================================== Viaggi
  - title: Viaggi
    path: viaggi
    icon: mdi:earth
    type: sections
    max_columns: 3
    sections:
      # ------------------------------------------------------------------ Map
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: I miei viaggi
            icon: mdi:earth
            badges:
              - type: entity
                entity: sensor.worldmap_places
                show_state: true
                show_icon: true
              - type: entity
                entity: sensor.worldmap_countries
                show_state: true
                show_icon: true
          - type: custom:worldmap-card
            title: Mappa
            height: 560
            grid_options:
              columns: full

      # ------------------------------------------------------------------ Numbers
      - type: grid
        cards:
          - type: heading
            heading: In numeri
            icon: mdi:counter
          - type: markdown
            grid_options:
              columns: full
            content: |-
              {% set places = state_attr('sensor.worldmap_places', 'places') or [] %}
              {% set dated = places | selectattr('date') | map(attribute='date') | sort | list %}
              {% set countries = states('sensor.worldmap_countries') | int(0) %}
              {% set ns = namespace(days=0) %}
              {% for p in places | selectattr('date') %}
              {% set ns.days = ns.days + (((as_datetime(p.date_end) - as_datetime(p.date)).days + 1) if p.date_end else 1) %}
              {% endfor %}
              {% if places %}
              {% set p = places[0] %}
              **Luoghi:** {{ places | count }} · **Paesi:** {{ countries }}

              **Ultimo:** <font color="{{ p.color }}">⚑</font> {{ p.name }}{% if p.country %} · {{ p.flag }} {{ p.country }}{% endif %}{% if p.date %} · {{ as_datetime(p.date).strftime('%d/%m/%Y') }}{% if p.date_end %} – {{ as_datetime(p.date_end).strftime('%d/%m/%Y') }}{% endif %}{% endif %}

              {% if dated %}
              **Primo viaggio:** {{ as_datetime(dated[0]).strftime('%d/%m/%Y') }}

              **Giorni in viaggio:** {{ ns.days }}
              {% endif %}
              **Mondo visitato:** {{ (countries / 195 * 100) | round(1) }}% dei 195 paesi
              {% else %}
              Nessuna bandierina ancora: clicca sulla mappa per aggiungere il primo luogo.
              {% endif %}

      # ------------------------------------------------------------------ Countries
      - type: grid
        cards:
          - type: heading
            heading: Paesi visitati
            icon: mdi:flag-variant
          - type: markdown
            grid_options:
              columns: full
            content: |-
              {% set places = state_attr('sensor.worldmap_places', 'places') or [] %}
              {% set ns = namespace(rows=[]) %}
              {% for g in places | selectattr('country') | groupby('country') %}
              {% set ns.rows = ns.rows + [{'name': g.grouper, 'flag': g.list[0].flag, 'n': g.list | length}] %}
              {% endfor %}
              {% for c in ns.rows | sort(attribute='name') | sort(attribute='n', reverse=true) %}
              {{ c.flag }} **{{ c.name }}** · {{ c.n }} {{ 'luogo' if c.n == 1 else 'luoghi' }}
              {% else %}
              Ancora nessun paese.
              {% endfor %}

      # ------------------------------------------------------------------ List
      - type: grid
        cards:
          - type: heading
            heading: Diario
            icon: mdi:notebook-outline
          - type: markdown
            grid_options:
              columns: full
            content: |-
              {% set places = state_attr('sensor.worldmap_places', 'places') or [] %}
              {% for p in places %}
              <font color="{{ p.color }}">⚑</font> **{{ p.name }}**{% if p.country %} · {{ p.flag }} {{ p.country }}{% endif %}{% if p.date %} · {{ as_datetime(p.date).strftime('%d/%m/%Y') }}{% if p.date_end %} – {{ as_datetime(p.date_end).strftime('%d/%m/%Y') }}{% endif %}{% endif %}{% if p.notes %}<br><small>{{ p.notes }}</small>{% endif %}

              {% else %}
              Il diario si riempie man mano che aggiungi bandierine.
              {% endfor %}

  # ================================================================== Aeroporti
  - title: Aeroporti
    path: aeroporti
    icon: mdi:airplane
    type: sections
    max_columns: 3
    sections:
      # ------------------------------------------------------------------ Map
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: I miei aeroporti
            icon: mdi:airplane
          - type: custom:worldmap-card
            map: aeroporti
            title: Aeroporti
            airports: true
            default_color: "#1e88e5"
            height: 560
            grid_options:
              columns: full

      # ------------------------------------------------------------------ Numbers
      - type: grid
        cards:
          - type: heading
            heading: In numeri
            icon: mdi:counter
          - type: markdown
            grid_options:
              columns: full
            content: |-
              {% set places = state_attr('sensor.worldmap_aeroporti_places', 'places') or [] %}
              {% set dated = places | selectattr('date') | map(attribute='date') | sort | list %}
              {% set countries = states('sensor.worldmap_aeroporti_countries') | int(0) %}
              {% set ns = namespace(days=0) %}
              {% for p in places | selectattr('date') %}
              {% set ns.days = ns.days + (((as_datetime(p.date_end) - as_datetime(p.date)).days + 1) if p.date_end else 1) %}
              {% endfor %}
              {% if places %}
              {% set p = places[0] %}
              **Aeroporti:** {{ places | count }} · **Paesi:** {{ countries }}

              **Ultimo:** <font color="{{ p.color }}">⚑</font> {{ p.name }}{% if p.country %} · {{ p.flag }} {{ p.country }}{% endif %}{% if p.date %} · {{ as_datetime(p.date).strftime('%d/%m/%Y') }}{% if p.date_end %} – {{ as_datetime(p.date_end).strftime('%d/%m/%Y') }}{% endif %}{% endif %}

              {% if dated %}
              **Primo volo:** {{ as_datetime(dated[0]).strftime('%d/%m/%Y') }}

              **Giorni di volo:** {{ ns.days }}
              {% endif %}
              **Mondo visitato:** {{ (countries / 195 * 100) | round(1) }}% dei 195 paesi
              {% else %}
              Nessun aeroporto ancora: cerca un codice (MXP), un nome (Malpensa) o una città (Roma), oppure clicca vicino a un aeroporto sulla mappa.
              {% endif %}

      # ------------------------------------------------------------------ Countries
      - type: grid
        cards:
          - type: heading
            heading: Paesi visitati
            icon: mdi:flag-variant
          - type: markdown
            grid_options:
              columns: full
            content: |-
              {% set places = state_attr('sensor.worldmap_aeroporti_places', 'places') or [] %}
              {% set ns = namespace(rows=[]) %}
              {% for g in places | selectattr('country') | groupby('country') %}
              {% set ns.rows = ns.rows + [{'name': g.grouper, 'flag': g.list[0].flag, 'n': g.list | length}] %}
              {% endfor %}
              {% for c in ns.rows | sort(attribute='name') | sort(attribute='n', reverse=true) %}
              {{ c.flag }} **{{ c.name }}** · {{ c.n }} {{ 'aeroporto' if c.n == 1 else 'aeroporti' }}
              {% else %}
              Ancora nessun paese.
              {% endfor %}

      # ------------------------------------------------------------------ List
      - type: grid
        cards:
          - type: heading
            heading: Elenco aeroporti
            icon: mdi:airport
          - type: markdown
            grid_options:
              columns: full
            content: |-
              {% set places = state_attr('sensor.worldmap_aeroporti_places', 'places') or [] %}
              {% for p in places %}
              <font color="{{ p.color }}">⚑</font> **{{ p.name }}**{% if p.country %} · {{ p.flag }} {{ p.country }}{% endif %}{% if p.date %} · {{ as_datetime(p.date).strftime('%d/%m/%Y') }}{% if p.date_end %} – {{ as_datetime(p.date_end).strftime('%d/%m/%Y') }}{% endif %}{% endif %}{% if p.notes %}<br><small>{{ p.notes }}</small>{% endif %}

              {% else %}
              L'elenco si riempie man mano che aggiungi aeroporti.
              {% endfor %}

  # ================================================================== Hotel
  - title: Hotel
    path: hotel
    icon: mdi:bed
    type: sections
    max_columns: 3
    sections:
      # ------------------------------------------------------------------ Map
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: I miei hotel
            icon: mdi:bed
          - type: custom:worldmap-card
            map: hotel
            title: Hotel
            rating: true
            poi: true
            default_color: "#d81b60"
            height: 560
            grid_options:
              columns: full

      # ------------------------------------------------------------------ Numbers
      - type: grid
        cards:
          - type: heading
            heading: In numeri
            icon: mdi:counter
          - type: markdown
            grid_options:
              columns: full
            content: |-
              {% set places = state_attr('sensor.worldmap_hotel_places', 'places') or [] %}
              {% set dated = places | selectattr('date') | map(attribute='date') | sort | list %}
              {% set countries = states('sensor.worldmap_hotel_countries') | int(0) %}
              {% set ns = namespace(days=0) %}
              {% for p in places | selectattr('date') %}
              {% set ns.days = ns.days + (((as_datetime(p.date_end) - as_datetime(p.date)).days) if p.date_end else 1) %}
              {% endfor %}
              {% if places %}
              {% set p = places[0] %}
              **Hotel:** {{ places | count }} · **Paesi:** {{ countries }}

              **Ultimo:** <font color="{{ p.color }}">⚑</font> {{ p.name }}{% if p.country %} · {{ p.flag }} {{ p.country }}{% endif %}{% if p.date %} · {{ as_datetime(p.date).strftime('%d/%m/%Y') }}{% if p.date_end %} – {{ as_datetime(p.date_end).strftime('%d/%m/%Y') }}{% endif %}{% endif %}
              {% set avg = state_attr('sensor.worldmap_hotel_places', 'average_rating') %}
              {% if avg %}
              **Voto medio:** <font color="#e91e63">{{ '♥' * (avg | round(0, 'common') | int) }}{{ '♡' * (5 - (avg | round(0, 'common') | int)) }}</font> {{ avg }}/5

              {% set best = places | selectattr('rating') | sort(attribute='rating', reverse=true) | first %}
              **Il migliore:** {{ best.name }} · <font color="#e91e63">{{ '♥' * best.rating }}</font>
              {% endif %}

              {% if dated %}
              **Primo soggiorno:** {{ as_datetime(dated[0]).strftime('%d/%m/%Y') }}

              **Notti:** {{ ns.days }}
              {% endif %}
              **Mondo visitato:** {{ (countries / 195 * 100) | round(1) }}% dei 195 paesi
              {% else %}
              Nessun hotel ancora: cerca l'hotel per nome (es. "Hotel Danieli Venezia") o clicca sull'edificio nella mappa.
              {% endif %}

      # ------------------------------------------------------------------ Countries
      - type: grid
        cards:
          - type: heading
            heading: Paesi visitati
            icon: mdi:flag-variant
          - type: markdown
            grid_options:
              columns: full
            content: |-
              {% set places = state_attr('sensor.worldmap_hotel_places', 'places') or [] %}
              {% set ns = namespace(rows=[]) %}
              {% for g in places | selectattr('country') | groupby('country') %}
              {% set ns.rows = ns.rows + [{'name': g.grouper, 'flag': g.list[0].flag, 'n': g.list | length}] %}
              {% endfor %}
              {% for c in ns.rows | sort(attribute='name') | sort(attribute='n', reverse=true) %}
              {{ c.flag }} **{{ c.name }}** · {{ c.n }} {{ 'hotel' if c.n == 1 else 'hotel' }}
              {% else %}
              Ancora nessun paese.
              {% endfor %}

      # ------------------------------------------------------------------ List
      - type: grid
        cards:
          - type: heading
            heading: Elenco hotel
            icon: mdi:bed-outline
          - type: markdown
            grid_options:
              columns: full
            content: |-
              {% set places = state_attr('sensor.worldmap_hotel_places', 'places') or [] %}
              {% for p in places %}
              <font color="{{ p.color }}">⚑</font> **{{ p.name }}**{% if p.country %} · {{ p.flag }} {{ p.country }}{% endif %}{% if p.date %} · {{ as_datetime(p.date).strftime('%d/%m/%Y') }}{% if p.date_end %} – {{ as_datetime(p.date_end).strftime('%d/%m/%Y') }}{% endif %}{% endif %}{% if p.rating %} · <font color="#e91e63">{{ '♥' * p.rating }}{{ '♡' * (5 - p.rating) }}</font>{% endif %}{% if p.notes %}<br><small>{{ p.notes }}</small>{% endif %}

              {% else %}
              L'elenco si riempie man mano che aggiungi hotel.
              {% endfor %}
