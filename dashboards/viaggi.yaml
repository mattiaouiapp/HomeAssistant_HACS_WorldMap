# Travels dashboard for MMOUi World Map.
#
# Uses the World Map card plus built-in cards. To install: Settings -> Dashboards ->
# Add dashboard -> New dashboard from scratch, open it, then menu (top right) ->
# Edit dashboard -> menu -> Raw configuration editor, and replace everything with this file.
#
# Entity IDs are fixed, so this works whatever language Home Assistant is set to.

title: Viaggi
views:
  - title: Viaggi
    path: viaggi
    icon: mdi:earth
    type: sections
    max_columns: 3
    sections:
      # ------------------------------------------------------------------ Map
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: I miei viaggi
            icon: mdi:earth
            badges:
              - type: entity
                entity: sensor.worldmap_places
                show_state: true
                show_icon: true
              - type: entity
                entity: sensor.worldmap_countries
                show_state: true
                show_icon: true
          - type: custom:worldmap-card
            title: Mappa
            height: 560
            grid_options:
              columns: full

      # ------------------------------------------------------------------ Numbers
      - type: grid
        cards:
          - type: heading
            heading: In numeri
            icon: mdi:counter
          - type: tile
            entity: sensor.worldmap_places
            name: Luoghi
            color: red
          - type: tile
            entity: sensor.worldmap_countries
            name: Paesi
            color: blue
          - type: markdown
            grid_options:
              columns: full
            content: |-
              {% set places = state_attr('sensor.worldmap_places', 'places') or [] %}
              {% set dated = places | selectattr('date') | map(attribute='date') | sort | list %}
              {% set countries = states('sensor.worldmap_countries') | int(0) %}
              {% if places %}
              {% set last = places[0] %}
              **Ultimo:** <font color="{{ last.color }}">⚑</font> {{ last.name }}{% if last.country %} · {{ last.flag }} {{ last.country }}{% endif %}{% if last.date %} · {{ as_datetime(last.date).strftime('%d/%m/%Y') }}{% endif %}

              {% if dated %}
              **Primo viaggio:** {{ as_datetime(dated[0]).strftime('%d/%m/%Y') }}

              **Anni di viaggio:** {{ dated | map('truncate', 4, true, '') | unique | list | length }}
              {% endif %}
              **Mondo visitato:** {{ (countries / 195 * 100) | round(1) }}% dei 195 paesi
              {% else %}
              Nessuna bandierina ancora: clicca sulla mappa per aggiungere il primo luogo.
              {% endif %}

      # ------------------------------------------------------------------ Countries
      - type: grid
        cards:
          - type: heading
            heading: Paesi visitati
            icon: mdi:flag-variant
          - type: markdown
            grid_options:
              columns: full
            content: |-
              {% set places = state_attr('sensor.worldmap_places', 'places') or [] %}
              {% set ns = namespace(rows=[]) %}
              {% for g in places | selectattr('country') | groupby('country') %}
              {% set ns.rows = ns.rows + [{'name': g.grouper, 'flag': g.list[0].flag, 'n': g.list | length}] %}
              {% endfor %}
              {% for c in ns.rows | sort(attribute='name') | sort(attribute='n', reverse=true) %}
              {{ c.flag }} **{{ c.name }}** · {{ c.n }} {{ 'luogo' if c.n == 1 else 'luoghi' }}
              {% else %}
              Ancora nessun paese.
              {% endfor %}

      # ------------------------------------------------------------------ Diary
      - type: grid
        cards:
          - type: heading
            heading: Diario
            icon: mdi:notebook-outline
          - type: markdown
            grid_options:
              columns: full
            content: |-
              {% set places = state_attr('sensor.worldmap_places', 'places') or [] %}
              {% for p in places %}
              <font color="{{ p.color }}">⚑</font> **{{ p.name }}**{% if p.country %} · {{ p.flag }} {{ p.country }}{% endif %}{% if p.date %} · {{ as_datetime(p.date).strftime('%d/%m/%Y') }}{% endif %}{% if p.notes %}<br><small>{{ p.notes }}</small>{% endif %}

              {% else %}
              Il diario si riempie man mano che aggiungi bandierine.
              {% endfor %}
